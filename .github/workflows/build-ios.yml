name: iOS build (HyperHLE + touchHLE dual-core)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-upstreams:
    name: Verify pinned upstream tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check integration patch scripts
        run: python3 -m py_compile scripts/patch-touchhle-ios.py scripts/patch-hyperhle-build-rust.py scripts/patch-hyperhle-ios-ui.py

      - name: Verify upstream refs
        shell: bash
        run: bash scripts/verify-upstreams.sh

  build-hyperhle:
    name: Build Core A baseline and dual-core candidate
    needs: verify-upstreams
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout this integration repository
        uses: actions/checkout@v4

      - name: Checkout HyperHLE-Reborn v1.3.6
        uses: actions/checkout@v4
        with:
          repository: KlugKlugTG/HyperHLE-Reborn
          ref: v1.3.6
          path: upstream/HyperHLE-Reborn
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Patch iOS host UI for the selected SDK
        run: python3 scripts/patch-hyperhle-ios-ui.py upstream/HyperHLE-Reborn/platform/ios/Sources/NativeHost.swift

      - name: Set the only secondary core label to official touchHLE v0.3.0
        run: python3 scripts/patch-hyperhle-core-label.py upstream/HyperHLE-Reborn/platform/ios/Sources/EmulatorCore.swift

      - name: Select newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -print | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install build tools
        run: |
          brew update
          brew install ninja ldid

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Boost 1.81.0 headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: upstream/HyperHLE-Reborn/vendor/boost
          key: boost-1.81.0-macos-${{ runner.arch }}

      - name: Download Boost 1.81.0
        if: steps.cache-boost.outputs.cache-hit != 'true'
        working-directory: upstream/HyperHLE-Reborn
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output boost_1_81_0.tar.gz \
            https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz

      - name: Extract Boost 1.81.0
        if: steps.cache-boost.outputs.cache-hit != 'true'
        working-directory: upstream/HyperHLE-Reborn
        run: |
          mkdir -p vendor
          tar -xzf boost_1_81_0.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost
          test -f vendor/boost/boost/config.hpp

      - name: Set up CMake 3.29
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          python3 --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build shared SDL2
        working-directory: upstream/HyperHLE-Reborn
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build iOS host and HyperHLE core
        working-directory: upstream/HyperHLE-Reborn
        env:
          CXXFLAGS: -std=c++17
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package and verify Core A baseline IPAs
        working-directory: upstream/HyperHLE-Reborn
        run: |
          sh platform/ios/scripts/package-ipa.sh
          sh platform/ios/scripts/package-ipa.sh --trollstore
          sh platform/ios/scripts/verify-ipa.sh dist/HyperHLE-iOS-unsigned.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore dist/HyperHLE-iOS-trollstore.ipa
          mkdir -p dist/core-a-baseline
          cp dist/HyperHLE-iOS-unsigned.ipa dist/core-a-baseline/
          cp dist/HyperHLE-iOS-trollstore.ipa dist/core-a-baseline/

      - name: Checkout official touchHLE v0.3.0
        uses: actions/checkout@v4
        with:
          repository: touchHLE/touchHLE
          ref: v0.3.0
          path: upstream/touchHLE
          submodules: recursive
          fetch-depth: 0

      - name: Install the Core B iOS entry crate and apply audited iOS patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/touchHLE/platform/ios/rust-entry/src
          cp integration/touchhle-ios-entry/Cargo.toml upstream/touchHLE/platform/ios/rust-entry/Cargo.toml
          cp integration/touchhle-ios-entry/src/lib.rs upstream/touchHLE/platform/ios/rust-entry/src/lib.rs
          python3 scripts/patch-touchhle-ios.py
          grep -q 'dynamic-sdl = ' upstream/touchHLE/Cargo.toml
          grep -q 'pub fn request_host_exit' upstream/touchHLE/src/lib.rs
          grep -q 'touchhle_ios_run_game' upstream/touchHLE/platform/ios/rust-entry/src/lib.rs

      - name: Prepare Core B Dynarmic JIT patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-hyperhle-build-rust.py upstream/HyperHLE-Reborn/platform/ios/scripts/build-rust.sh
          patched="$(sh upstream/HyperHLE-Reborn/platform/ios/scripts/patched-source.sh \
            upstream/touchHLE/vendor/dynarmic \
            upstream/HyperHLE-Reborn/platform/ios/patches/dynarmic-ios-jit.patch \
            upstream/touchHLE/build/dynarmic-ios-src)"
          echo "TOUCHHLE_DYNARMIC_DIR=$GITHUB_WORKSPACE/$patched" >> "$GITHUB_ENV"

      - name: Build dual-core iOS host (Core A + Core B)
        working-directory: upstream/HyperHLE-Reborn
        env:
          TOUCHHLE_CORE_REPO: ${{ github.workspace }}/upstream/touchHLE
          CXXFLAGS: -std=c++17
        run: |
          sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Verify Core B dylib exports, SDL linkage and iOS minimum
        shell: bash
        run: |
          set -euo pipefail
          core="upstream/HyperHLE-Reborn/build/rust-ios-native/aarch64-apple-ios/release/libtouchhle_core.dylib"
          test -f "$core"
          nm -gU "$core" | grep 'touchhle_ios_run_game'
          nm -gU "$core" | grep 'touchhle_ios_request_exit'
          otool -L "$core" | grep 'libSDL2-2.0.0.dylib'
          vtool -show-build "$core" | grep 'minos 15.0'
          otool -D "$core" | grep '@rpath/libtouchhle_core.dylib'

      - name: Package and verify dual-core TrollStore IPAs
        working-directory: upstream/HyperHLE-Reborn
        run: |
          sh platform/ios/scripts/package-ipa.sh
          sh platform/ios/scripts/package-ipa.sh --trollstore
          sh platform/ios/scripts/verify-ipa.sh dist/HyperHLE-iOS-unsigned.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore dist/HyperHLE-iOS-trollstore.ipa
          sh "${GITHUB_WORKSPACE}/scripts/verify-dualcore-ipa.sh" dist/HyperHLE-iOS-trollstore.ipa

      - name: Write build report
        if: always()
        working-directory: upstream/HyperHLE-Reborn
        shell: bash
        run: |
          mkdir -p dist
          {
            echo "HyperHLE-Reborn: v1.3.6"
            echo "Integration repository commit: ${GITHUB_SHA}"
            echo "Runner: ${RUNNER_OS} / ${RUNNER_ARCH}"
            xcodebuild -version || true
            rustc --version || true
            cargo --version || true
            for ipa in dist/HyperHLE-iOS-unsigned.ipa dist/HyperHLE-iOS-trollstore.ipa; do
              if [ -f "$ipa" ]; then
                shasum -a 256 "$ipa"
              else
                echo "IPA not produced: $ipa"
              fi
            done
          } > dist/BUILD-REPORT.txt

      - name: Upload Core A baseline, dual-core candidate and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HyperHLE-iOS-v1.3.6-dualcore-candidate
          path: |
            upstream/HyperHLE-Reborn/dist/*.ipa
            upstream/HyperHLE-Reborn/dist/core-a-baseline/*.ipa
            upstream/HyperHLE-Reborn/dist/BUILD-REPORT.txt
          if-no-files-found: warn
          retention-days: 14

  touchhle-source-audit:
    name: Audit official touchHLE v0.3.0 source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official touchHLE v0.3.0
        uses: actions/checkout@v4
        with:
          repository: touchHLE/touchHLE
          ref: v0.3.0
          path: upstream/touchHLE
      - name: Confirm Rust library crate types and record source revision
        working-directory: upstream/touchHLE
        run: |
          grep -A2 '^\[lib\]' Cargo.toml
          grep -q '"cdylib"' Cargo.toml
          grep -q '"rlib"' Cargo.toml
          git rev-parse HEAD
          echo "Official touchHLE v0.3.0 source pin verified; adapter build is exercised in the dual-core job above."
