name: iOS build (official touchHLE v0.3.0 only)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touchhle-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upstreams:
    name: Verify pinned upstream tags and patch scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check integration scripts
        run: python3 -m py_compile scripts/patch-touchhle-ios.py scripts/patch-touchhle-eagl-diagnostics.py scripts/patch-hyperhle-build-rust.py scripts/patch-hyperhle-ios-ui.py scripts/patch-hyperhle-core-label.py scripts/patch-touchhle-dynarmic-ios15-jit.py
      - name: Verify upstream refs
        run: bash scripts/verify-upstreams.sh

  build-touchhle-only:
    name: Build iOS host with Core B only (touchHLE v0.3.0)
    needs: verify-upstreams
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Checkout HyperHLE iOS host (host/UI only)
        uses: actions/checkout@v4
        with:
          repository: KlugKlugTG/HyperHLE-Reborn
          ref: v1.3.6
          path: upstream/HyperHLE-Reborn
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout official touchHLE v0.3.0
        uses: actions/checkout@v4
        with:
          repository: touchHLE/touchHLE
          ref: v0.3.0
          path: upstream/touchHLE
          submodules: recursive
          fetch-depth: 0

      - name: Patch host UI and expose only the v0.3.0 core label
        run: |
          python3 scripts/patch-hyperhle-ios-ui.py upstream/HyperHLE-Reborn/platform/ios/Sources/NativeHost.swift
          python3 scripts/patch-hyperhle-core-label.py upstream/HyperHLE-Reborn/platform/ios/Sources/EmulatorCore.swift

      - name: Select newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -print | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install build tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja ldid

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Boost 1.81.0 headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: upstream/HyperHLE-Reborn/vendor/boost
          key: boost-1.81.0-macos-${{ runner.arch }}

      - name: Download Boost 1.81.0
        if: steps.cache-boost.outputs.cache-hit != 'true'
        working-directory: upstream/HyperHLE-Reborn
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output boost_1_81_0.tar.gz \
            https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz

      - name: Extract Boost 1.81.0
        if: steps.cache-boost.outputs.cache-hit != 'true'
        working-directory: upstream/HyperHLE-Reborn
        run: |
          mkdir -p vendor
          tar -xzf boost_1_81_0.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost
          test -f vendor/boost/boost/config.hpp

      - name: Set up CMake 3.29
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          python3 --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build shared SDL2
        working-directory: upstream/HyperHLE-Reborn
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Install Core B iOS adapter and apply official v0.3.0 patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/touchHLE/platform/ios/rust-entry/src
          cp integration/touchhle-ios-entry/Cargo.toml upstream/touchHLE/platform/ios/rust-entry/Cargo.toml
          cp integration/touchhle-ios-entry/src/lib.rs upstream/touchHLE/platform/ios/rust-entry/src/lib.rs
          python3 scripts/patch-touchhle-ios.py
          python3 scripts/patch-touchhle-eagl-diagnostics.py
          grep -q 'dynamic-sdl = ' upstream/touchHLE/Cargo.toml
          grep -q 'touchhle_ios_run_game' upstream/touchHLE/platform/ios/rust-entry/src/lib.rs
          grep -q 'iOS EAGL diagnostic: present' upstream/touchHLE/src/frameworks/opengles/eagl.rs

      - name: Prepare Core B iOS 15 JIT source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-hyperhle-build-rust.py upstream/HyperHLE-Reborn/platform/ios/scripts/build-rust.sh
          patched="$(sh upstream/HyperHLE-Reborn/platform/ios/scripts/patched-source.sh \
            upstream/touchHLE/vendor/dynarmic \
            upstream/HyperHLE-Reborn/platform/ios/patches/dynarmic-ios-jit.patch \
            upstream/touchHLE/build/dynarmic-ios-src)"
          python3 scripts/patch-touchhle-dynarmic-ios15-jit.py "$patched"
          grep -q "PROT_READ | PROT_WRITE | PROT_EXEC" "$patched/externals/oaknut/include/oaknut/code_block.hpp"
          grep -q "mprotect(m_memory, m_size, PROT_READ | PROT_EXEC)" "$patched/externals/oaknut/include/oaknut/code_block.hpp"
          grep -q "mprotect(m_memory, m_size, PROT_READ | PROT_WRITE)" "$patched/externals/oaknut/include/oaknut/code_block.hpp"
          if grep -q "brk #0xf00d" "$patched/externals/oaknut/include/oaknut/code_block.hpp"; then
            echo "Core B must not use the debugger-only BRK JIT broker." >&2
            exit 1
          fi
          echo "TOUCHHLE_DYNARMIC_DIR=$GITHUB_WORKSPACE/$patched" >> "$GITHUB_ENV"

      - name: Install official touchHLE v0.3.0 default options into app resources
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/touchHLE/touchHLE_default_options.txt
          cp upstream/touchHLE/touchHLE_default_options.txt upstream/HyperHLE-Reborn/touchHLE_default_options.txt
          grep -F 'com.namconetworks.AceCombatXi:' upstream/HyperHLE-Reborn/touchHLE_default_options.txt

      - name: Build ONLY official touchHLE v0.3.0 Core B
        working-directory: upstream/HyperHLE-Reborn
        env:
          TOUCHHLE_CORE_REPO: ${{ github.workspace }}/upstream/touchHLE
          CXXFLAGS: -std=c++17
        run: |
          set -euo pipefail
          rm -rf build/rust-ios-native/aarch64-apple-ios
          TOUCHHLE_CORE_REPO="$TOUCHHLE_CORE_REPO" \
          TOUCHHLE_DYNARMIC_DIR="$TOUCHHLE_DYNARMIC_DIR" \
            sh platform/ios/scripts/build-rust.sh aarch64-apple-ios Release
          test -f build/rust-ios-native/aarch64-apple-ios/release/libtouchhle_core.dylib
          test ! -f build/rust-ios-native/aarch64-apple-ios/release/libhyperhle_core.dylib

      - name: Build iOS host app without building Core A
        working-directory: upstream/HyperHLE-Reborn
        run: |
          set -euo pipefail
          xcodebuild \
            -project platform/ios/TouchHLEHost.xcodeproj \
            -scheme TouchHLEHost \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/host-iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Core B dylib exports and iOS minimum
        shell: bash
        run: |
          set -euo pipefail
          core="upstream/HyperHLE-Reborn/build/rust-ios-native/aarch64-apple-ios/release/libtouchhle_core.dylib"
          test -f "$core"
          nm -gU "$core" | grep 'touchhle_ios_run_game'
          nm -gU "$core" | grep 'touchhle_ios_request_exit'
          otool -L "$core" | grep 'libSDL2-2.0.0.dylib'
          vtool -show-build "$core" | grep 'minos 15.0'
          otool -D "$core" | grep '@rpath/libtouchhle_core.dylib'
          test ! -e upstream/HyperHLE-Reborn/build/rust-ios-native/aarch64-apple-ios/release/libhyperhle_core.dylib

      - name: Package and verify touchHLE-only TrollStore IPA
        working-directory: upstream/HyperHLE-Reborn
        run: |
          set -euo pipefail
          sh platform/ios/scripts/package-ipa.sh --trollstore
          sh "${GITHUB_WORKSPACE}/scripts/verify-touchhle-only-ipa.sh" dist/HyperHLE-iOS-trollstore.ipa

      - name: Write build report
        if: always()
        working-directory: upstream/HyperHLE-Reborn
        shell: bash
        run: |
          mkdir -p dist
          {
            echo "Host: HyperHLE-Reborn iOS host v1.3.6 (Core A not built or shipped)"
            echo "Only emulator core: official touchHLE v0.3.0"
            echo "Integration repository commit: ${GITHUB_SHA}"
            echo "Runner: ${RUNNER_OS} / ${RUNNER_ARCH}"
            xcodebuild -version || true
            rustc --version || true
            cargo --version || true
            if [ -f dist/HyperHLE-iOS-trollstore.ipa ]; then
              shasum -a 256 dist/HyperHLE-iOS-trollstore.ipa
            else
              echo "TrollStore IPA not produced"
            fi
          } > dist/BUILD-REPORT.txt

      - name: Upload touchHLE-only IPA and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchHLE-v0.3.0-iOS15-CoreB-only
          path: |
            upstream/HyperHLE-Reborn/dist/HyperHLE-iOS-trollstore.ipa
            upstream/HyperHLE-Reborn/dist/BUILD-REPORT.txt
          if-no-files-found: warn
          retention-days: 14
