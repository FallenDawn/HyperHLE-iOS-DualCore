# Keep this adapter as its own Cargo workspace. It depends on the
# upstream touchHLE package by path but is intentionally not a member of
# touchHLE's workspace.
[workspace]

[package]
name = "touchhle-ios-entry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "touchhle_core"
crate-type = ["cdylib"]

[dependencies]
touchHLE = { path = "../../..", default-features = false, features = ["dynamic-sdl"] }
